name: update-flake-lock

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: dev
          fetch-depth: 0

      - name: Fetch main and dev
        run: git fetch origin main dev

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update flake.lock
        run: nix flake update

      - name: Detect flake.lock changes
        id: flake_lock_changes
        run: |
          if git diff --quiet -- flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push flake.lock to dev
        if: steps.flake_lock_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore: update flake.lock"
          git push origin HEAD:dev

      - name: Create or update dev to main pull request
        id: dev_to_main_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pr_body="$(mktemp)"
          cat <<'EOF' > "$pr_body"
          Automated update of `flake.lock` on `dev`.

          Source branch: `dev`
          Target branch: `main`

          This PR was created by GitHub Actions and is configured for merge auto-merge after required checks pass.
          EOF

          pr_number="$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')"

          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --title "chore: merge dev into main" \
              --body-file "$pr_body" \
              --add-label dependencies \
              --add-label automation
            echo "pull-request-number=$pr_number" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          dev_ahead_of_main="$(git rev-list --count origin/main..HEAD)"
          if [ "$dev_ahead_of_main" -eq 0 ]; then
            echo "No open dev->main PR and no commits to merge."
            echo "pull-request-number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pr_url="$(gh pr create \
            --base main \
            --head dev \
            --title "chore: merge dev into main" \
            --body-file "$pr_body" \
            --label dependencies \
            --label automation)"

          pr_number="$(gh pr view "$pr_url" --json number --jq '.number')"
          echo "pull-request-number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Enable auto-merge
        if: steps.dev_to_main_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --merge "${{ steps.dev_to_main_pr.outputs.pull-request-number }}"

  sync-dev-with-main:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch main and dev
        run: git fetch origin main dev

      - name: Fast-forward dev to main
        run: |
          if ! git merge-base --is-ancestor origin/dev origin/main; then
            echo "dev is not an ancestor of main; refusing to overwrite diverged dev."
            exit 1
          fi

          if [ "$(git rev-parse origin/dev)" = "$(git rev-parse origin/main)" ]; then
            echo "dev is already up to date with main."
            exit 0
          fi

          git push origin origin/main:refs/heads/dev
